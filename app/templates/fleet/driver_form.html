<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if driver %}Edit driver{% else %}Add driver{% endif %} | Fleet</title>
  <!-- F1's shared styles. Missing until main.css is pushed. -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components/fleet.css') }}">
</head>
<body>
  <!-- Temporary header and menu so the pages can be opened on their own.
       Delete this block and use the base template once F1 ships base.html. -->
  <header class="fleet-temp-header">
    <strong>Car Rental</strong>
    <nav aria-label="Fleet">
      <a href="/fleet">Dashboard</a>
      <a href="/fleet/vehicles">Cars</a>
      <a href="/fleet/insurance">Insurance</a>
      <a href="/fleet/maintenance">Maintenance</a>
      <a href="/fleet/drivers" class="current">Drivers</a>
      <a href="/fleet/assignment-history">Change history</a>
    </nav>
  </header>

  <main class="fleet-page">
    {% include "shared/_flash.html" %}
    <h1>{% if driver %}Edit driver{% else %}Add driver{% endif %}</h1>

    <form class="card form-layout"
          action="{% if driver %}/fleet/drivers/{{ driver.Driver_ID }}/edit{% else %}/fleet/drivers/new{% endif %}"
          method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-row">
        <div class="form-field">
          <label for="first_name">First name</label>
          <input id="first_name" name="first_name" value="{{ driver.First_Name if driver else '' }}" required>
        </div>
        <div class="form-field">
          <label for="last_name">Last name</label>
          <input id="last_name" name="last_name" value="{{ driver.Last_Name if driver else '' }}" required>
        </div>
      </div>

      <div class="form-field">
        <label for="license">License number</label>
        <input id="license" name="license_number"
               value="{{ driver.License_Number if driver else '' }}" required>
      </div>

      <div class="form-actions">
        <button class="btn" type="submit">{% if driver %}Save changes{% else %}Add driver{% endif %}</button>
        <a href="/fleet/drivers">Cancel</a>
      </div>
    </form>
  </main>
</body>
</html>
