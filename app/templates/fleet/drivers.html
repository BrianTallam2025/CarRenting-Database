<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drivers | Fleet</title>
  <!-- F1's shared styles. Missing until main.css is pushed. -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components/fleet.css') }}">
</head>
<body>
  <!-- Temporary header and menu so the pages can be opened on their own.
       Delete this block and use the base template once F1 ships base.html. -->
  <header class="fleet-temp-header">
    <strong>Car Rental</strong>
    <nav aria-label="Fleet">
      <a href="/fleet">Dashboard</a>
      <a href="/fleet/vehicles">Cars</a>
      <a href="/fleet/insurance">Insurance</a>
      <a href="/fleet/maintenance">Maintenance</a>
      <a href="/fleet/drivers" class="current">Drivers</a>
    </nav>
  </header>

  <main class="fleet-page">
    <div class="page-top">
      <h1>Drivers</h1>
      <a class="btn" href="/fleet/drivers/new">Add driver</a>
    </div>

    <div class="card">
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Name</th><th>License number</th><th>Availability</th><th></th></tr>
          </thead>
          <tbody>
            <!-- {% for d in drivers %}
            status badge: status-available or status-assigned
            edit link: /fleet/drivers/{{ d.Driver_ID }}/edit
            {% endfor %} -->
            <tr class="empty-row"><td colspan="4">No drivers yet.</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</body>
</html>
