{% extends "shared/base.html" %}
{% block title %}Schedule maintenance | Fleet{% endblock %}
{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/components/fleet.css') }}">
{% endblock %}
{% block content %}
    <h1>Schedule maintenance</h1>

    <form class="card form-layout" action="/fleet/maintenance/new" method="post">
      <!-- The backend rejects a car that is rented out or already has an active job.
           Show its message in the flash area. -->
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-field">
        <label for="vehicle">Car</label>
        <select id="vehicle" name="vehicle_id" required>
          <option value="">Choose a car</option>
          {% for v in vehicles %}
          <option value="{{ v.Vehicle_ID }}">{{ v.Plate_Number }}, {{ v.Make }} {{ v.Model }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-row">
        <div class="form-field">
          <label for="start">Start date</label>
          <input id="start" type="date" name="start_date" required>
        </div>
        <div class="form-field">
          <label for="end">End date</label>
          <input id="end" type="date" name="end_date">
        </div>
      </div>

      <div class="form-field">
        <label for="description">Description</label>
        <textarea id="description" name="description" required></textarea>
      </div>

      <div class="form-actions">
        <button class="btn" type="submit">Schedule</button>
        <a href="/fleet/maintenance">Cancel</a>
      </div>
    </form>
{% endblock %}
