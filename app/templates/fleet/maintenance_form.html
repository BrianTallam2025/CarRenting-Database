<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Schedule maintenance | Fleet</title>
  <!-- F1's shared styles. Missing until main.css is pushed. -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components/fleet.css') }}">
</head>
<body>
  <!-- Temporary header and menu so the pages can be opened on their own.
       Delete this block and use {% extends "shared/base.html" %} once F1 ships base.html. -->
  <header class="fleet-temp-header">
    <strong>Car Rental</strong>
    <nav aria-label="Fleet">
      <a href="dashboard.html">Dashboard</a>
      <a href="vehicles.html">Cars</a>
      <a href="insurance.html">Insurance</a>
      <a href="maintenance.html" class="current">Maintenance</a>
      <a href="drivers.html">Drivers</a>
    </nav>
  </header>

  <main class="fleet-page">
    <h1>Schedule maintenance</h1>

    <form class="card form-layout" action="/fleet/maintenance/new" method="post">
      <!-- The backend rejects a car that is rented out or already has an active job.
           Show its message in the flash area. -->
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-field">
        <label for="vehicle">Car</label>
        <select id="vehicle" name="vehicle_id" required>
          <option value="">Choose a car</option>
          <!-- {% for v in vehicles %}<option value="{{ v.Vehicle_ID }}">{{ v.Plate_Number }}, {{ v.Make }} {{ v.Model }}</option>{% endfor %} -->
        </select>
      </div>

      <div class="form-row">
        <div class="form-field">
          <label for="start">Start date</label>
          <input id="start" type="date" name="start_date" required>
        </div>
        <div class="form-field">
          <label for="end">End date</label>
          <input id="end" type="date" name="end_date" required>
        </div>
      </div>

      <div class="form-field">
        <label for="description">Description</label>
        <textarea id="description" name="description" required></textarea>
      </div>

      <div class="form-actions">
        <button class="btn" type="submit">Schedule</button>
        <a href="maintenance.html">Cancel</a>
      </div>
    </form>
  </main>
</body>
</html>
