<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cars | Fleet</title>
  <!-- F1's shared styles. Missing until main.css is pushed. -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components/fleet.css') }}">
</head>
<body>
  <!-- Temporary header and menu so the pages can be opened on their own.
       Delete this block and use {% extends "shared/base.html" %} once F1 ships base.html. -->
  <header class="fleet-temp-header">
    <strong>Car Rental</strong>
    <nav aria-label="Fleet">
      <a href="dashboard.html">Dashboard</a>
      <a href="vehicles.html" class="current">Cars</a>
      <a href="insurance.html">Insurance</a>
      <a href="maintenance.html">Maintenance</a>
      <a href="drivers.html">Drivers</a>
    </nav>
  </header>

  <main class="fleet-page">
    <div class="page-top">
      <h1>Cars</h1>
      <a class="btn" href="vehicle_new.html">Add car</a>
    </div>

    <div class="card">
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Plate</th><th>VIN</th><th>Make</th><th>Model</th><th>Year</th><th>Daily rate (KES)</th><th>Status</th><th></th></tr>
          </thead>
          <tbody>
            <!-- {% for v in vehicles %}
            status badge: <span class="status-badge status-{{ v.Status }}">{{ v.Status }}</span>
            edit link: /fleet/vehicles/{{ v.Vehicle_ID }}/edit
            {% endfor %} -->
            <tr class="empty-row"><td colspan="8">No cars in the fleet yet.</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
