{% extends "shared/base.html" %}
{% block title %}Register | Car Rental{% endblock %}
{% block content %}
<div class="auth">
  <h1>Create an account</h1>
  {% if form.errors %}
  <div class="flashes"><p class="flash error">Please check the form and try again.</p></div>
  {% endif %}
  <form method="post" action="{{ url_for('accounts.register') }}">
    {{ form.hidden_tag() }}
    <label>{{ form.first_name.label.text }} {{ form.first_name(autocomplete='given-name', required=true) }}
      {% for error in form.first_name.errors %}<span class="form-error">{{ error }}</span>{% endfor %}
    </label>
    <label>{{ form.last_name.label.text }} {{ form.last_name(autocomplete='family-name', required=true) }}
      {% for error in form.last_name.errors %}<span class="form-error">{{ error }}</span>{% endfor %}
    </label>
    <label>{{ form.email.label.text }} {{ form.email(type='email', autocomplete='email', required=true) }}
      {% for error in form.email.errors %}<span class="form-error">{{ error }}</span>{% endfor %}
    </label>
    <label>{{ form.password.label.text }} {{ form.password(autocomplete='new-password', required=true) }}
      {% for error in form.password.errors %}<span class="form-error">{{ error }}</span>{% endfor %}
    </label>
    <label>{{ form.national_id.label.text }} {{ form.national_id(required=true) }}
      {% for error in form.national_id.errors %}<span class="form-error">{{ error }}</span>{% endfor %}
    </label>
    <label>{{ form.license_number.label.text }} {{ form.license_number(required=true) }}
      {% for error in form.license_number.errors %}<span class="form-error">{{ error }}</span>{% endfor %}
    </label>
    <label>{{ form.license_expiry.label.text }} {{ form.license_expiry(required=true) }}
      {% for error in form.license_expiry.errors %}<span class="form-error">{{ error }}</span>{% endfor %}
    </label>
    {{ form.submit(class_='btn') }}
  </form>
  <p class="muted">Already registered? <a href="{{ url_for('accounts.login') }}">Log in</a>.</p>
</div>
{% endblock %}
